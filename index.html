<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 번호 추천</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <p class="eyebrow">행운의 순간을 만나보세요</p>
        <h1>로또 번호 추천 사이트</h1>
        <p class="subtitle">
          오늘의 운을 담아 랜덤하게 번호를 생성해 드립니다.
        </p>

        <div class="controls">
          <label for="count">추천 세트 수</label>
          <select id="count">
            <option value="1">1세트</option>
            <option value="2">2세트</option>
            <option value="3">3세트</option>
            <option value="4">4세트</option>
          </select>
          <button id="generateBtn">번호 생성하기</button>
        </div>

        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
