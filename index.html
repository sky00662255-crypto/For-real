<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 번호 추천</title>
    <script>
      (() => {
        let savedTheme;

        try {
          savedTheme = localStorage.getItem("theme");
        } catch {
          savedTheme = null;
        }

        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const isValidTheme = savedTheme === "light" || savedTheme === "dark";
        document.documentElement.dataset.theme = isValidTheme ? savedTheme : preferredTheme;
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="라이트 모드로 전환"
          aria-pressed="true"
        >
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span class="theme-label">라이트 모드</span>
        </button>
        <p class="eyebrow">행운의 순간을 만나보세요</p>
        <h1>로또 번호 추천 사이트</h1>
        <p class="subtitle">
          오늘의 운을 담아 랜덤하게 번호를 생성해 드립니다.
        </p>

        <div class="controls">
          <label for="count">추천 세트 수</label>
          <select id="count">
            <option value="1">1세트</option>
            <option value="2">2세트</option>
            <option value="3">3세트</option>
            <option value="4">4세트</option>
          </select>
          <button id="generateBtn">번호 생성하기</button>
        </div>

        <div id="results" class="results" aria-live="polite"></div>

        <section class="contact-section" aria-labelledby="contactTitle">
          <div class="contact-heading">
            <p class="eyebrow">PARTNERSHIP</p>
            <h2 id="contactTitle">제휴 문의</h2>
            <p>함께하고 싶은 제안이 있다면 편하게 남겨주세요.</p>
          </div>

          <form
            class="contact-form"
            action="https://formspree.io/f/mgogkkld"
            method="POST"
          >
            <input type="hidden" name="_subject" value="로또 번호 추천 사이트 제휴 문의" />
            <input
              class="form-trap"
              type="text"
              name="_gotcha"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
            />

            <div class="form-field">
              <label for="partnerName">이름 또는 회사명</label>
              <input
                id="partnerName"
                name="name"
                type="text"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-field">
              <label for="partnerEmail">이메일</label>
              <input
                id="partnerEmail"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-field form-field-wide">
              <label for="partnerMessage">문의 내용</label>
              <textarea
                id="partnerMessage"
                name="message"
                rows="5"
                placeholder="제휴 목적과 제안 내용을 알려주세요."
                required
              ></textarea>
            </div>

            <button class="contact-submit" type="submit">문의 보내기</button>
          </form>
        </section>

        <section class="comments-section" aria-labelledby="commentsTitle">
          <div class="comments-heading">
            <p class="eyebrow">COMMENTS</p>
            <h2 id="commentsTitle">댓글</h2>
          </div>
          <div id="disqus_thread"></div>
          <noscript>
            댓글을 보려면 JavaScript를 활성화해 주세요.
            <a href="https://disqus.com/?ref_noscript">Disqus에서 댓글 보기</a>
          </noscript>
        </section>
      </section>
    </main>

    <script src="main.js"></script>
    <script>
      var disqus_config = function () {
        this.page.url = "https://sky00662255-crypto.github.io/For-real/";
        this.page.identifier = "for-real-home";
      };

      (function () {
        var d = document;
        var s = d.createElement("script");
        s.src = "https://sky0625.disqus.com/embed.js";
        s.setAttribute("data-timestamp", String(+new Date()));
        (d.head || d.body).appendChild(s);
      })();
    </script>
  </body>
</html>
